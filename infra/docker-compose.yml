# Deliberately namespaced "signora-v2" rather than "signora": an earlier
# incarnation of this project left containers and a PostgreSQL 16 volume
# under the "signora" project name. Keeping this stack separate means the
# ratified PostgreSQL 17 stack (ADR-0006) can never adopt or destroy that
# older state.
#
# **One project per environment, from 2026-08-05** — 436 change (2), approved by
# the product owner: *"create separate environment for each lane so that nothing
# could be shared."* This was a fixed `signora-v2`, so four clones ran
# `docker compose` against one project and shared one PostgreSQL server: one
# connection pool, one lock manager, and one **cluster-wide role**. That last one
# is what aborted certification cycle 57 on `ALTER ROLE signora_app NOBYPASSRLS`,
# and no per-database separation could ever have reached it.
#
# **Read from the variable rather than removed**, because a `name:` in this file
# *overrides* `COMPOSE_PROJECT_NAME` — so deleting the line would work and
# stating it wrong would silently keep one project. The default preserves
# today's behaviour exactly for anyone who sets nothing.
#
# Container names and volumes are already scoped by project. **The host port is
# the only thing four stacks genuinely collide on**, which is why the ports
# below are the rest of this change.
name: ${COMPOSE_PROJECT_NAME:-signora-v2}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: signora
      POSTGRES_PASSWORD: signora
      POSTGRES_DB: signora
    ports:
      - "${SIGNORA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      # Creates the least-privilege signora_app login role on first init so
      # local development connects as a non-superuser and RLS actually
      # applies (see migration 0002).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signora -d signora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${SIGNORA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signora
      MINIO_ROOT_PASSWORD: signora-local-dev
    ports:
      - "${SIGNORA_MINIO_PORT:-9000}:9000"
      - "${SIGNORA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Named explicitly for the PostgreSQL major version so a future major
  # upgrade is an explicit, deliberate migration rather than a container
  # that silently fails to start against incompatible data files.
  postgres17_data:
  minio_data:
