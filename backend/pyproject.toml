[project]
name = "signora-backend"
version = "0.1.0"
description = "Signora — AI Revenue Intelligence Platform (backend)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
    "casbin>=1.36",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "sentry-sdk>=2.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "import-linter>=2.1",
    "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "signora_platform", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"signora_platform/authorization/policies" = "signora_platform/authorization/policies"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["modules", "signora_platform", "apps"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "arq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "casbin.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop for both tests and fixtures: the integration suite
# shares session-scoped asyncpg engines, and asyncpg connections cannot be
# used across event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["modules", "signora_platform", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "security_invariant: permanent architectural guarantee (tests/security_invariants)",
    "integration: tests that require a running PostgreSQL instance",
]

[tool.importlinter]
root_packages = ["modules", "signora_platform", "apps"]
# Required so the "domain has no framework dependencies" contract can name
# third-party packages (sqlalchemy, fastapi, ...) as forbidden.
include_external_packages = true

# Enforces Clean Architecture layering within every module (15-project-structure.md).
# Each entry here mirrors the "domain/application/infrastructure/interface/public"
# contract. Add one contract block per module as modules are added — this file does
# not auto-discover modules, by design, so a missing contract is a visible review flag.
# Clean Architecture layering, enforced per module via a shared container
# contract: adding a module to `containers` is the only step needed to bring
# it under enforcement. Parenthesised layers are optional — interface/ is
# added per module as its HTTP surface is built, and its absence must not
# fail the contract.
[[tool.importlinter.contracts]]
name = "modules: Clean Architecture layering"
type = "layers"
containers = [
    "modules.workspace_tenancy",
    "modules.provider_platform",
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
    "modules.ai_platform",
    "modules.ai_reasoning_engine",
]
layers = [
    # Optional and topmost. `evaluation/` exists only in the AI Platform: it
    # is the harness, it consumes every layer beneath it, and nothing may
    # consume it — a module whose own code depended on how it is measured
    # would be measuring itself.
    "(evaluation)",
    "(interface)",
    "infrastructure",
    "public",
    "application",
    "domain",
]

# The dependency graph in 05-module-dependencies.md, enforced rather than
# reviewed. A module may reach another module only through its `public/`
# contract — never its domain, application, infrastructure, or interface
# layers. Cross-module imports of an ORM model or a use case compile and
# run perfectly well, which is exactly why the rule needs a machine behind
# it: the violation is invisible until the modules need to move apart.
# `allow_indirect_imports` keeps these contracts about *direct* reaches.
# Importing a module's `public/` inevitably pulls its `domain/` behind it —
# that is what a public contract re-exporting its own vocabulary looks
# like, and flagging it would make the rule unusable rather than strict.
[[tool.importlinter.contracts]]
name = "provider_normalization reaches provider_platform only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.provider_normalization"]
forbidden_modules = [
    "modules.provider_platform.domain",
    "modules.provider_platform.application",
    "modules.provider_platform.infrastructure",
    "modules.provider_platform.interface",
    "modules.knowledge_graph",
]

[[tool.importlinter.contracts]]
name = "knowledge_graph reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.knowledge_graph"]
forbidden_modules = [
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
]

[[tool.importlinter.contracts]]
name = "observation_engine reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.observation_engine"]
forbidden_modules = [
    "modules.knowledge_graph.domain",
    "modules.knowledge_graph.application",
    "modules.knowledge_graph.infrastructure",
    "modules.knowledge_graph.interface",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
]

[[tool.importlinter.contracts]]
name = "business_event_engine reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.business_event_engine"]
forbidden_modules = [
    "modules.observation_engine.domain",
    "modules.observation_engine.application",
    "modules.observation_engine.infrastructure",
    "modules.observation_engine.interface",
    "modules.knowledge_graph",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
]

[[tool.importlinter.contracts]]
name = "signal_engine reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.signal_engine"]
forbidden_modules = [
    "modules.business_event_engine.domain",
    "modules.business_event_engine.application",
    "modules.business_event_engine.infrastructure",
    "modules.business_event_engine.interface",
    "modules.observation_engine",
    "modules.knowledge_graph",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
]

[[tool.importlinter.contracts]]
name = "buying_score_engine reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.buying_score_engine"]
forbidden_modules = [
    "modules.signal_engine.domain",
    "modules.signal_engine.application",
    "modules.signal_engine.infrastructure",
    "modules.signal_engine.interface",
    # M5B weighs hypotheses; it does not form them. Reaching past the
    # Signal Engine to business events would let a weighting rule quietly
    # become a detection rule, in the module least equipped to review it.
    "modules.business_event_engine",
    "modules.observation_engine",
    "modules.knowledge_graph",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
]

[[tool.importlinter.contracts]]
name = "opportunity_engine reaches upstream modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.opportunity_engine"]
forbidden_modules = [
    "modules.buying_score_engine.domain",
    "modules.buying_score_engine.application",
    "modules.buying_score_engine.infrastructure",
    "modules.buying_score_engine.interface",
    # M6 decides what to track; it never forms hypotheses or weighs them.
    # Reaching past the Buying Score Engine would let a workflow rule
    # quietly become an intelligence rule, in the module least equipped to
    # review it.
    "modules.signal_engine",
    "modules.business_event_engine",
    "modules.observation_engine",
    "modules.knowledge_graph",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
    "modules.workspace_tenancy.domain",
    "modules.workspace_tenancy.application",
    "modules.workspace_tenancy.infrastructure",
    "modules.workspace_tenancy.interface",
]

# --------------------------------------------------------------------------
# AI Platform (M8) — infrastructure, not a pipeline stage.
#
# The ratified condition is not "ai_platform must not import business
# modules". It is sharper, and needs two contracts to say:
#
#   domain/ and application/  ->  know NOTHING of the pipeline, at all
#   infrastructure/           ->  may satisfy a port from another module's
#                                 public/ contract, and nothing deeper
#
# That is the whole reason `ExplanationSource` is a Protocol declared in
# application/ports.py and satisfied by an adapter in infrastructure/. The
# substrate stays extractable and fake-testable, and it is still pure
# substrate on the day M9 arrives, whatever M8 built on top of it
# (28-ai-platform.md, "the substrate never depends on the pipeline").
#
# A single blanket ban would have been simpler and wrong: it would forbid
# the adapter the design requires, and the usual resolution to that is an
# exemption, which is how the rule stops meaning anything.
# --------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "ai_platform: domain and application know nothing of the pipeline"
type = "forbidden"
source_modules = [
    "modules.ai_platform.domain",
    "modules.ai_platform.application",
]
forbidden_modules = [
    "modules.provider_platform",
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
    "modules.workspace_tenancy",
]

[[tool.importlinter.contracts]]
name = "ai_platform infrastructure reaches business modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.ai_platform.infrastructure"]
forbidden_modules = [
    "modules.opportunity_engine.domain",
    "modules.opportunity_engine.application",
    "modules.opportunity_engine.infrastructure",
    "modules.opportunity_engine.interface",
    "modules.buying_score_engine.domain",
    "modules.buying_score_engine.application",
    "modules.buying_score_engine.infrastructure",
    "modules.buying_score_engine.interface",
    "modules.signal_engine.domain",
    "modules.signal_engine.application",
    "modules.signal_engine.infrastructure",
    "modules.signal_engine.interface",
    "modules.business_event_engine.domain",
    "modules.business_event_engine.application",
    "modules.business_event_engine.infrastructure",
    "modules.business_event_engine.interface",
    "modules.observation_engine.domain",
    "modules.observation_engine.application",
    "modules.observation_engine.infrastructure",
    "modules.observation_engine.interface",
    "modules.knowledge_graph.domain",
    "modules.knowledge_graph.application",
    "modules.knowledge_graph.infrastructure",
    "modules.knowledge_graph.interface",
    "modules.provider_normalization.domain",
    "modules.provider_normalization.application",
    "modules.provider_normalization.infrastructure",
    "modules.provider_normalization.interface",
    "modules.provider_platform",
    "modules.workspace_tenancy.domain",
    "modules.workspace_tenancy.application",
    "modules.workspace_tenancy.infrastructure",
    "modules.workspace_tenancy.interface",
]

# No vendor SDK, no transport, no ORM below the adapter line. This is the
# structural form of "never call a model vendor's SDK from domain or
# application code" (CLAUDE.md §10) — the rule exists because a vendor call
# buried in a use case is invisible until the vendor changes, and by then
# every caller has grown to depend on its shape.
[[tool.importlinter.contracts]]
name = "ai_platform: domain has no infrastructure/framework dependencies"
type = "forbidden"
source_modules = ["modules.ai_platform.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "httpx",
    "arq",
    "signora_platform.db",
    "signora_platform.event_bus",
    "signora_platform.api",
    "signora_platform.auth",
    "signora_platform.authorization",
]

# The graph is acyclic (05-module-dependencies.md). An upstream module that
# imports a downstream one has inverted the pipeline, and no amount of
# indirection makes that safe to extract later.
[[tool.importlinter.contracts]]
name = "provider_platform depends on no downstream module"
type = "forbidden"
source_modules = ["modules.provider_platform"]
forbidden_modules = [
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
]

[[tool.importlinter.contracts]]
name = "knowledge_graph depends on no downstream module"
type = "forbidden"
source_modules = ["modules.knowledge_graph"]
forbidden_modules = [
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
]

[[tool.importlinter.contracts]]
name = "observation_engine depends on no downstream module"
type = "forbidden"
source_modules = ["modules.observation_engine"]
forbidden_modules = ["modules.business_event_engine", "modules.signal_engine", "modules.buying_score_engine", "modules.opportunity_engine"]

[[tool.importlinter.contracts]]
name = "business_event_engine depends on no downstream module"
type = "forbidden"
source_modules = ["modules.business_event_engine"]
forbidden_modules = ["modules.signal_engine", "modules.buying_score_engine", "modules.opportunity_engine"]

[[tool.importlinter.contracts]]
name = "buying_score_engine depends on no downstream module"
type = "forbidden"
source_modules = ["modules.buying_score_engine"]
forbidden_modules = ["modules.opportunity_engine"]

[[tool.importlinter.contracts]]
name = "signal_engine depends on no downstream module"
type = "forbidden"
source_modules = ["modules.signal_engine"]
forbidden_modules = ["modules.buying_score_engine", "modules.opportunity_engine"]

# The other direction. Stated once rather than appended to each module's
# downstream list, because it is a single architectural fact and three of
# the nine modules have no downstream contract to append it to — a per-module
# expression would silently exempt them.
#
# The AI Platform explains what the pipeline already concluded. A pipeline
# module reaching *into* it would mean a stage asking a model to help decide
# its own output, which is the inversion every layering rule in this
# repository exists to prevent.
[[tool.importlinter.contracts]]
# The harness reads recorded expectations, never the pipeline that produced
# them. Seeding a golden dataset needs the pipeline; *evaluating* against one
# must not — otherwise a change upstream moves a prompt's score without the
# prompt, the model or the criteria changing, and the number stops meaning
# anything.
name = "ai_platform: the evaluation harness never reaches the pipeline"
type = "forbidden"
source_modules = ["modules.ai_platform.evaluation"]
forbidden_modules = [
    "modules.provider_platform",
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
    "modules.workspace_tenancy",
]

[[tool.importlinter.contracts]]
# M9 concludes; it does not re-derive. Everything it needs about an
# opportunity, its score, its ledger and its signals arrives through
# `opportunity_engine.public`, which already carries the whole chain — so a
# direct reach into a deeper layer is a module rebuilding a view another
# module already publishes.
# **One narrow exception, ruled 2026-07-30 (T128).**
# `modules.ai_reasoning_engine.evaluation` is a *composition root*, not part
# of the module's runtime surface: it wires an adapter, a registry and a
# harness so a developer can run `make eval`. Wiring infrastructure is what a
# composition root is for, and M8 carves out its own `infrastructure/` layer
# for exactly this reason.
#
# Rejected alternatives, recorded so they are not re-proposed: exporting the
# harness through `ai_platform.public` would publish a large surface whose
# only consumer is a developer command and freeze it before M10 has used it;
# an output-type registry would be indirection introduced solely to route
# around a boundary.
#
# The exemption is deliberately one module deep. Nothing else under
# `ai_reasoning_engine` may reach past another module's `public/`.
name = "ai_reasoning_engine reaches other modules only through public/"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["modules.ai_reasoning_engine"]
ignore_imports = [
    "modules.ai_reasoning_engine.evaluation.** -> modules.ai_platform.**",
]
forbidden_modules = [
    "modules.opportunity_engine.domain",
    "modules.opportunity_engine.application",
    "modules.opportunity_engine.infrastructure",
    "modules.opportunity_engine.interface",
    "modules.buying_score_engine.domain",
    "modules.buying_score_engine.application",
    "modules.buying_score_engine.infrastructure",
    "modules.buying_score_engine.interface",
    "modules.signal_engine.domain",
    "modules.signal_engine.application",
    "modules.signal_engine.infrastructure",
    "modules.signal_engine.interface",
    "modules.ai_platform.domain",
    "modules.ai_platform.application",
    "modules.ai_platform.infrastructure",
    "modules.ai_platform.evaluation",
]

[[tool.importlinter.contracts]]
# The pipeline stages M9 reads from must never read back. An upstream module
# that learned what was concluded about its own output would make the
# derivation circular — and every stage before this one is rebuildable
# precisely because nothing downstream feeds it.
name = "no upstream module depends on the AI Reasoning Engine"
type = "forbidden"
source_modules = [
    "modules.provider_platform",
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
    "modules.workspace_tenancy",
    "modules.ai_platform",
]
forbidden_modules = ["modules.ai_reasoning_engine"]

[[tool.importlinter.contracts]]
name = "ai_reasoning_engine: domain has no infrastructure/framework dependencies"
type = "forbidden"
source_modules = ["modules.ai_reasoning_engine.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "httpx",
    "arq",
    "signora_platform.db",
    "signora_platform.event_bus",
    "signora_platform.api",
    "signora_platform.auth",
    "signora_platform.authorization",
]

[[tool.importlinter.contracts]]
name = "no business module depends on the AI Platform"
type = "forbidden"
source_modules = [
    "modules.provider_platform",
    "modules.provider_normalization",
    "modules.knowledge_graph",
    "modules.observation_engine",
    "modules.business_event_engine",
    "modules.signal_engine",
    "modules.buying_score_engine",
    "modules.opportunity_engine",
    "modules.workspace_tenancy",
]
forbidden_modules = ["modules.ai_platform"]

[[tool.importlinter.contracts]]
name = "workspace_tenancy: domain has no infrastructure/framework dependencies"
type = "forbidden"
source_modules = ["modules.workspace_tenancy.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "httpx",
    "arq",
    "signora_platform.db",
    "signora_platform.event_bus",
    "signora_platform.api",
    "signora_platform.auth",
    "signora_platform.authorization",
]

# signora_platform/ is shared *technical* infrastructure; dependencies point
# from modules/ into it, never the reverse. A violation here means
# business logic has leaked into the platform layer
# (docs/architecture/15-project-structure.md).
[[tool.importlinter.contracts]]
name = "signora_platform must not depend on any module"
type = "forbidden"
source_modules = ["signora_platform"]
forbidden_modules = ["modules"]

[tool.coverage.run]
source = ["modules", "signora_platform", "apps"]
branch = true
omit = [
    # Test support code is exercised by the tests themselves; measuring it
    # inflates the number without saying anything about production code.
    "*/tests/*",
    "migrations/*",
    # Process lifecycle glue: the ARQ WorkerSettings class, startup/shutdown
    # hooks, and the asyncio.run entry point. These are verified by running
    # the processes, not by unit tests — asserting that a framework's
    # entry-point contract was satisfied would test the mock, not the system.
    # The *logic* inside these modules (dispatch_event's retry and
    # dead-letter policy, pool resolution) IS tested; only the wiring is
    # excluded. See tests/integration/test_worker_retry.py and
    # apps/tests/test_worker_pools.py.
    "apps/worker/relay_main.py",
]

[tool.coverage.report]
# Baseline is set to the current measured value and ratcheted upward as
# coverage improves. It never moves down without an explicit, reviewed
# decision — a falling baseline is how coverage gates quietly stop working.
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[[tool.importlinter.contracts]]
name = "simulation must not depend on any module"
type = "forbidden"
source_modules = ["signora_platform.simulation"]
forbidden_modules = ["modules"]
# The simulator produces provider payloads only; everything downstream is
# discovered by the platform itself. A simulator that reads a Signal to
# decide what to emit next makes every scenario pass while proving nothing
# about the pipeline (20-provider-simulation.md, principle 2).
