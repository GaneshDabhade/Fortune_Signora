[project]
name = "signora-backend"
version = "0.1.0"
description = "Signora — AI Revenue Intelligence Platform (backend)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
    "casbin>=1.36",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "sentry-sdk>=2.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "import-linter>=2.1",
    "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "signora_platform", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"signora_platform/authorization/policies" = "signora_platform/authorization/policies"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["modules", "signora_platform", "apps"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "arq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "casbin.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop for both tests and fixtures: the integration suite
# shares session-scoped asyncpg engines, and asyncpg connections cannot be
# used across event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["modules", "signora_platform", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "security_invariant: permanent architectural guarantee (tests/security_invariants)",
    "integration: tests that require a running PostgreSQL instance",
]

[tool.importlinter]
root_packages = ["modules", "signora_platform", "apps"]
# Required so the "domain has no framework dependencies" contract can name
# third-party packages (sqlalchemy, fastapi, ...) as forbidden.
include_external_packages = true

# Enforces Clean Architecture layering within every module (15-project-structure.md).
# Each entry here mirrors the "domain/application/infrastructure/interface/public"
# contract. Add one contract block per module as modules are added — this file does
# not auto-discover modules, by design, so a missing contract is a visible review flag.
# Clean Architecture layering, enforced per module via a shared container
# contract: adding a module to `containers` is the only step needed to bring
# it under enforcement. Parenthesised layers are optional — interface/ is
# added per module as its HTTP surface is built, and its absence must not
# fail the contract.
[[tool.importlinter.contracts]]
name = "modules: Clean Architecture layering"
type = "layers"
containers = ["modules.workspace_tenancy"]
layers = [
    "(interface)",
    "infrastructure",
    "public",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "workspace_tenancy: domain has no infrastructure/framework dependencies"
type = "forbidden"
source_modules = ["modules.workspace_tenancy.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "httpx",
    "arq",
    "signora_platform.db",
    "signora_platform.event_bus",
    "signora_platform.api",
    "signora_platform.auth",
    "signora_platform.authorization",
]

# signora_platform/ is shared *technical* infrastructure; dependencies point
# from modules/ into it, never the reverse. A violation here means
# business logic has leaked into the platform layer
# (docs/architecture/15-project-structure.md).
[[tool.importlinter.contracts]]
name = "signora_platform must not depend on any module"
type = "forbidden"
source_modules = ["signora_platform"]
forbidden_modules = ["modules"]

[tool.coverage.run]
source = ["modules", "signora_platform", "apps"]
branch = true
omit = [
    # Test support code is exercised by the tests themselves; measuring it
    # inflates the number without saying anything about production code.
    "*/tests/*",
    "migrations/*",
    # Process lifecycle glue: the ARQ WorkerSettings class, startup/shutdown
    # hooks, and the asyncio.run entry point. These are verified by running
    # the processes, not by unit tests — asserting that a framework's
    # entry-point contract was satisfied would test the mock, not the system.
    # The *logic* inside these modules (dispatch_event's retry and
    # dead-letter policy, pool resolution) IS tested; only the wiring is
    # excluded. See tests/integration/test_worker_retry.py and
    # apps/tests/test_worker_pools.py.
    "apps/worker/relay_main.py",
]

[tool.coverage.report]
# Baseline is set to the current measured value and ratcheted upward as
# coverage improves. It never moves down without an explicit, reviewed
# decision — a falling baseline is how coverage gates quietly stop working.
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[[tool.importlinter.contracts]]
name = "simulation must not depend on any module"
type = "forbidden"
source_modules = ["signora_platform.simulation"]
forbidden_modules = ["modules"]
# The simulator produces provider payloads only; everything downstream is
# discovered by the platform itself. A simulator that reads a Signal to
# decide what to emit next makes every scenario pass while proving nothing
# about the pipeline (20-provider-simulation.md, principle 2).
