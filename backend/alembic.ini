[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is deliberately absent — migrations/env.py reads
# SIGNORA_DATABASE_URL from os.environ directly.
#
# Corrected 2026-08-11 (B-183). This said env.py sources it from
# get_settings(), "the same single source of truth the application itself
# uses". Both halves were wrong, and env.py had already corrected itself on
# 2026-07-30 while this file kept the superseded claim. It reads os.environ,
# and the value is deliberately NOT the application's: the migration step
# connects as the owner, the API and workers as signora_app. Describing them
# as one source inverts a security property (CLAUDE.md §8).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
