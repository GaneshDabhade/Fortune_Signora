# Signora authorization model — role-in-workspace RBAC.
#
# Request tuple: (sub, dom, obj, act)
#   sub — the caller's workspace role ("owner", "member"), already resolved
#         from a server-side-verified membership. It is deliberately NOT the
#         user id: membership lives in PostgreSQL under Row-Level Security
#         and is verified per request, so mirroring it into Casbin's grouping
#         policy would duplicate the source of truth and let the two drift.
#   dom — the workspace id. Present in every request tuple so no check can
#         ever be evaluated globally (ADR-0010).
#   obj — the resource type ("workspace", "member").
#   act — the action ("read", "update", "add", "remove").
#
# Policies use "*" as the domain, meaning "applies in every workspace".
# The matcher still compares domains, so a future per-workspace policy
# override works without a model change.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && (p.dom == "*" || r.dom == p.dom) && r.obj == p.obj && r.act == p.act
