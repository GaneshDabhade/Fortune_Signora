# ⚠️  INTENTIONALLY DISABLED — Local-First Development Policy.
#
# Signora is in its architecture-first phase. Every check below already runs
# locally and is what actually closes a milestone (CLAUDE.md §20e, ADR-0027).
# Re-running the same verification remotely after a push adds no confidence —
# it consumes minutes and attention, and it makes a `git push` mean something
# other than "store the repository safely".
#
# This file is RETAINED, not deleted: the job definitions are correct and are
# what CI will be re-activated from once the architecture, the Intelligence
# Pipeline, the Workflow Pipeline and the AI Platform have stabilised and CI
# is explicitly requested. Until then the only trigger is manual dispatch.
#
# Do not add `push:`, `pull_request:`, or `schedule:` triggers here.

# Platform Smoke Test — the platform foundation completion gate (M1.4).
#
# Required before every milestone and every release — run **locally**, as
# `make smoke`. The defects it catches (a worker that cannot start, a
# readiness probe that never reports failure, a relay that dies on a database
# blip) are all invisible to a fully passing test suite, which is why it is a
# gate at all; running it locally is what makes it one today.
name: Platform Smoke Test

on:
  # Manual only. See the policy note above.
  workflow_dispatch:

jobs:
  smoke:
    name: make smoke
    runs-on: ubuntu-latest
    # The command builds both images from scratch; 25 minutes leaves room on
    # a cold cache without letting a hang consume a full hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Needed to mint a token through the real frontend issuance path and to
      # run the Security Invariants against the running stack.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Platform smoke test
        run: make smoke
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file infra/.env.prod-local -f infra/docker-compose.prod.yml logs --tail 200
