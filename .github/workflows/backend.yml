name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, types, and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      - name: import-linter (module boundaries)
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signora
          POSTGRES_PASSWORD: signora
          POSTGRES_DB: signora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signora -d signora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNORA_DATABASE_URL: postgresql+asyncpg://signora:signora@localhost:5432/signora
      SIGNORA_REDIS_URL: redis://localhost:6379/0
      # The suite truncates every table between tests. Explicit opt-in, so
      # pointing it at a database that matters fails instead of wiping it.
      SIGNORA_ALLOW_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      # The GitHub Actions service container cannot run the
      # docker-entrypoint-initdb.d script that creates this role locally, so
      # it is created here. Tests must connect as a non-superuser or RLS is
      # not enforced and every isolation assertion passes vacuously.
      # signora_auth is created here too: the security invariants assert
      # that the two tiers' privileges are disjoint, which needs both roles
      # to exist. Migration 0005 creates it NOLOGIN; the password is
      # deployment configuration, not schema.
      - name: Create least-privilege roles
        run: |
          PGPASSWORD=signora psql -h localhost -U signora -d signora \
            -c "CREATE ROLE signora_app LOGIN PASSWORD 'signora_app_local_dev';" \
            -c "CREATE ROLE signora_auth LOGIN PASSWORD 'signora_auth_local_dev';" \
            -c "CREATE ROLE signora_relay LOGIN PASSWORD 'signora_relay_local_dev';"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Run first and reported separately. These are architectural
      # guarantees, not features — a failure here means a property the
      # system is built on has stopped holding, and burying it among
      # several hundred feature results makes that easy to miss.
      - name: Security invariants
        run: uv run pytest -m security_invariant -v

      - name: Run tests with coverage gate
        run: uv run pytest -v --cov --cov-report=term-missing
