name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run

  contract:
    name: Cross-tier JWT contract
    runs-on: ubuntu-latest
    # The only check that proves both tiers agree on the JWT contract.
    # Each tier's own tests verify its understanding of the boundary; this
    # verifies they are the same understanding.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signora
          POSTGRES_PASSWORD: signora
          POSTGRES_DB: signora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signora -d signora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIGNORA_DATABASE_URL: postgresql+asyncpg://signora:signora@localhost:5432/signora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci --legacy-peer-deps
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Create least-privilege roles
        working-directory: backend
        run: |
          PGPASSWORD=signora psql -h localhost -U signora -d signora \
            -c "CREATE ROLE signora_app LOGIN PASSWORD 'signora_app_local_dev';" \
            -c "CREATE ROLE signora_auth LOGIN PASSWORD 'signora_auth_local_dev';" \
            -c "CREATE ROLE signora_relay LOGIN PASSWORD 'signora_relay_local_dev';"
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Cross-tier contract test
        working-directory: backend
        run: uv run pytest tests/integration/test_jwt_cross_tier_contract.py -v
