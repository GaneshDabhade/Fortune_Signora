would a salesperson use this word unprompted about their own job?

⛔ AND THE BOUNDARY IS THE ADR'S, not this row's: the context owns lifecycle,
approval, withdrawal, the reversible window, execution metadata and the public
contract. It never owns business semantics. The consuming domain interprets,
validates, executes, and implements the inverse.
