# ⚠️ **Ownership is not a licence to change it.** §20a still freezes this tree:
# Lane C owns the architecture and every change still needs an approved RFC —
# [ADR-0404](../architecture/adr/0404-platform-composition.md) is what makes
# TASK-418 buildable, not this row. **What changed is that the work now has an
# owner; what did not change is what the owner may do without approval.**
#
# **And feature lanes still consume it without a handoff** — §20a's own text:
# adding a subscription, an event type or a worker pool is *a use of the
