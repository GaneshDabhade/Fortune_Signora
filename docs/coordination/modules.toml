# The module ownership registry — the authoritative source.
#
# Ratified 2026-08-04, product owner: *"define ownership in a single
# authoritative registry with fields such as module, bounded context, current
# owner, future owner, transition stage, review owner. Then generate the
# ownership dashboards from that registry. This keeps ownership as structured
# repository metadata rather than something inferred from reports or commit
# history."*
#
# This is step 1 of `docs/architecture/428-lane-coordination-model.md`, and the
# defect it closes is C-213: an assignee copied into a coordination row, correct
# on 2026-08-03 and stale by 2026-08-04, which blocked TASK-205 for two days.
#
# **Nothing stores an assignee twice.** A coordination item, a backlog row or a
# defect names its *module*; the assignee is joined from here when a view is
# rendered. Moving a module is a one-line edit and every view follows.
#
# **Only what cannot be derived is stored.** Epic, active slice, execution
# status, QE status and blocking dependency are read from the execution board,
# because storing them here would be the second representation `CLAUDE.md` §2
# forbids — and the copy nobody maintains is the one somebody will read.
#
# Read with stdlib `tomllib`. PyYAML is not a declared project dependency and
# adding one is a red-budget change requiring an ADR (§6).
#
# ── Who writes this file ────────────────────────────────────────────────────
# The product owner. Module assignment is authoritative and is theirs alone
# (D-057). Lane C drafts a change and never lands one unruled.
#
# ── The ownership precedence ────────────────────────────────────────────────
# Ratified 2026-08-04, product owner, correcting 430's original basis:
#
#   1. Product architecture
#   2. Bounded context
#   3. Long-term maintenance responsibility
#   4. Repository continuity
#   5. Historical implementation evidence
#
# **Git history is evidence. It is not governance.** `last_work` below records
# the evidence at rung 5 and is never the reason for an assignment on its own.
#
# ── implementation ──────────────────────────────────────────────────────────
# **A Lane C estimate, banded to the nearest 5, and the one non-computed field
# here.** A module has no denominator in the repository — there is no recorded
# "planned total" to divide by — so this cannot be arithmetic and is not
# presented as any. `basis` records what it was read from. `PROJECT_STATUS.md`
# remains authoritative for measured progress (§20e), and this never contradicts
# it.

[meta]
ratified = 2026-08-04
precedence = ["product architecture", "bounded context", "long-term maintenance", "repository continuity", "historical evidence"]
# Every module's review owner today. Named once rather than repeated per row —
# a constant copied sixteen times is sixteen chances to disagree with itself.
default_review_owner = "Lane C"

# Transition stages, and the vocabulary is closed:
#   settled      current owner is the steady-state owner; nothing moves
#   gated        future owner differs; the gate names what must happen first
#   review-at-first-implementation
#                deliberately unassigned. Ownership becomes obvious when
#                implementation reaches it — evidence over prediction

