# THE AUTHENTICATION JOURNEYS — Fortune Signora Authentication.dc.html
#
# ⚡ The design names five journeys of its own and twenty-four screens. The
# workflow split below is the PRODUCT OWNER'S (D-158), not this office's, and
# the screen assignment is measured from the design rather than invented —
# see 488 §6 and §6a.
# ══════════════════════════════════════════════════════════════════════════════

[workflow.1]
name        = "Login"
state       = "on_main"
# ⚡ 2026-08-08 — the code is on `main` and the conformance audit PASSES:
#   screen 02 is 12 of 12 elements (was 3 of 12 on 2026-08-07) · card geometry
#   4 of 4 · all seven foundation gaps closed · zero genuine legacy-UI or
#   workaround findings. ⛔ The backlog rows still read IN VALIDATION, which is
#   QE's state to move and never this office's (D-123).
#   ✅ Under D-169 reaching `main` releases Workflow 2 — it does NOT wait for
#   the product owner's review, which is now a checkpoint.
design      = "Fortune Signora Authentication.dc.html"
screens     = ["02 Sign in", "03 Sign in — failed", "15 Authenticating", "17 Unauthorized"]
tasks       = ["TASK-467", "TASK-483", "TASK-484"]
defects     = ["B-315", "B-312"]
gap_analysis = "docs/architecture/488-workflow-1-login-gap.md"
owner       = "Lane A"
# ⛔ Screens deliberately EXCLUDED, each with its reason — 488 §6a.
excluded    = [
  "16 Authentication error — quotes an identity provider verbatim; there is no SSO",
  "11 Account locked · 12 Too many attempts — no lockout capability exists (C-431)",
  "18 Session expired — renders over the App Shell, which is workflow 13",
]

