# ── Not customer journeys, and deliberately not numbered as workflows ────────
# `Design System v2` is the component library every workflow composes from
# (TASK-448, TASK-478). `System States` is cross-cutting — loading, empty,
# error and permission states that belong INSIDE each workflow rather than
# beside them, which is exactly what D-156 ⑤ requires. `Design Review` is a
# pre-refactor record, not a screen. **Three of the twenty-six designs are not
# journeys, which is why this file holds twenty-seven workflows and not
# twenty-six or twenty-four.**
