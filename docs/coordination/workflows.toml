# The customer-journey pipeline — D-160.
#
# **One workflow is implemented at a time; many are planned ahead of it.** This
# file is where that distinction is stored, because [D-160](../DECISION_REGISTER.md)
# asks for *"an explicit state"* per workflow and a state kept in prose is a
# state the generator cannot read — a lesson this office has now paid for three
# times (D-155, D-157, D-158, each corrected by moving a ruling into the data).
#
# ⛔ **This is not a specification.** [D-137](../DECISION_REGISTER.md) forbids a
# copied specification, an exported checklist or an intermediate implementation
# guide, and [D-138](../DECISION_REGISTER.md) makes
# [`design-snapshot/`](../design-snapshot/MANIFEST.md) the implementation
# authority. **Every workflow below names the design document it derives from
# and stores no design content of its own.** The decomposition lives in
# `BACKLOG.md` rows, which is the artifact §20e permits Product Office to write.
#
# ⚡ **The pipeline is planned many workflows deep and active exactly one deep.**
# **`active` is the only state an implementation lane may build in**, and it
# advances only when the product owner has reviewed the previous workflow on
# `main` ([D-153](../DECISION_REGISTER.md) ⑥).
#
# ── The twelve states, as D-160 names them ──────────────────────────────────
#   planned      the journey is identified and its design document is named
#   decomposed   epic, tasks, slices, dependencies and reuse are written
#   sequenced    placed in the queue behind its predecessor's review gate
#   ready        claimable — dependencies resolved, owner assigned
#   active       being implemented. ⛔ NORMALLY EXACTLY ONE
#   in_progress  a lane holds a row inside it
#   in_validation the lane has pushed and set the state
#   awaiting_qe  with QE for certification
#   on_main      promoted — ⚡ THIS is what releases the next workflow (D-169)
#   awaiting_review  the product owner has been notified
#   approved     reviewed and approved — ⚠️ a CHECKPOINT since D-169, not a gate
#   complete     approved and closed out
#
# ⛔ **Generated views read this file; nothing restates a workflow's state.**

# ── ⚡ WATCHED ARCHITECTURAL TRIGGERS — 496, 2026-08-08 ─────────────────────
# **Conditions that change a ratified decision, watched here rather than left
# in a document.** ⛔ 496 §5 attack ③ is why: this office identified the design
# tokens, published the finding, and never scheduled the work — and a lane paid
# for it. A trigger in a document is a trigger nobody checks.
#
# [trigger.object_level_sharing]
#   watch   = "any finalized design showing one person sharing one record with
#              another named person"
#   then    = "adopt OpenFGA behind the existing enforcer port (496 §2.2)"
#   why     = "RLS and a role matrix both stop being sufficient on the same day"
#   status  = "NOT MET — checked across all 26 designs 2026-08-08"
#
# [trigger.formal_verification]
#   watch   = "formal verification becomes an enterprise buying requirement,
#              or the capability matrix passes ~500 rules (today: 53)"
#   then    = "replace Casbin with Cedar behind the same port"
#   status  = "NOT MET"
#
# [trigger.better_auth_authz]
#   watch   = "Better Auth ships workspace-scoped ABAC with non-human subjects"
#   then    = "reopen D-175 — this is the evidence that would change it"
#   status  = "NOT MET — 1.5 trajectory is identity, not domain authorization"
# ───────────────────────────────────────────────────────────────────────────

[meta]
authority   = "docs/design-snapshot/screens/"
ruling      = "D-160"
updated     = 2026-08-07
active_rule = "exactly one workflow may be `active`; reaching `on_main` releases the next — D-169"
release_rule = "⚡ AMENDED 2026-08-08. ONE trigger, not two: the lane's own `IN VALIDATION` releases the next row, within a workflow AND between workflows. D-169 set the between-workflow trigger to `on_main`, and applied literally that made a lane idle a full QE cycle every time it finished a workflow — the exact waiting D-169 exists to remove, reappearing at the boundary. Safe because D-161 ④ and D-162 ④ require conformance findings to be fixed in the foundation, so they propagate to anything built meanwhile. The audit still runs on `main` before any review request; it no longer gates the next workflow. `approved` is a CHECKPOINT recorded after the fact, never a prerequisite. The pixel-level conformance audit remains mandatory before any review is requested, and is now the only gate."

# ══════════════════════════════════════════════════════════════════════════════
# THE AUTHENTICATION JOURNEYS — Fortune Signora Authentication.dc.html
#
# ⚡ The design names five journeys of its own and twenty-four screens. The
# workflow split below is the PRODUCT OWNER'S (D-158), not this office's, and
# the screen assignment is measured from the design rather than invented —
# see 488 §6 and §6a.
# ══════════════════════════════════════════════════════════════════════════════

[workflow.1]
name        = "Login"
state       = "on_main"
# ⚡ 2026-08-08 — the code is on `main` and the conformance audit PASSES:
#   screen 02 is 12 of 12 elements (was 3 of 12 on 2026-08-07) · card geometry
#   4 of 4 · all seven foundation gaps closed · zero genuine legacy-UI or
#   workaround findings. ⛔ The backlog rows still read IN VALIDATION, which is
#   QE's state to move and never this office's (D-123).
#   ✅ Under D-169 reaching `main` releases Workflow 2 — it does NOT wait for
#   the product owner's review, which is now a checkpoint.
design      = "Fortune Signora Authentication.dc.html"
screens     = ["02 Sign in", "03 Sign in — failed", "15 Authenticating", "17 Unauthorized"]
tasks       = ["TASK-467", "TASK-483", "TASK-484"]
defects     = ["B-315", "B-312"]
gap_analysis = "docs/architecture/488-workflow-1-login-gap.md"
owner       = "Lane A"
# ⛔ Screens deliberately EXCLUDED, each with its reason — 488 §6a.
excluded    = [
  "16 Authentication error — quotes an identity provider verbatim; there is no SSO",
  "11 Account locked · 12 Too many attempts — no lockout capability exists (C-431)",
  "18 Session expired — renders over the App Shell, which is workflow 13",
]

[workflow.2]
name        = "Registration"
state       = "on_main"
# ⚡ DELIVERED 2026-08-08 — TASK-485 IN VALIDATION with a headed journey pass.
# ⚠️ Was `in_progress` until 2026-08-08. The row moved to IN VALIDATION and the
# workflow's state did not follow — the same defect one level up, and the state
# a lane reads is this one. `awaiting_qe` / `on_main` are QE's to trigger.
design      = "Fortune Signora Authentication.dc.html"
screens     = ["01 Welcome", "06 Create account"]
tasks       = ["TASK-485"]
owner       = "Lane A"
depends_on  = ["workflow.1"]

[workflow.3]
name        = "Email Verification"
state       = "on_main"
# ⚠️ On `main` WITHOUT its primary control — screen 07's six-digit boxes.
# `email-otp` is installed and unregistered; TASK-498 registers it. Lane A
# shipped everything else and wrote a test asserting the boxes' ABSENCE,
# which is the difference between a declared limitation and a discovered one.
# ⚡ RELEASED 2026-08-08 on Workflow 2's IN VALIDATION, not on `main` — see
# release_rule above. Lane A must not idle a QE cycle at every boundary.
# ⚠️ Set `active` 2026-08-08, corrected from `ready`. The header says `active`
# is THE ONLY STATE AN IMPLEMENTATION LANE MAY BUILD IN — and this workflow's
# rows were claimable while no workflow was `active` at all, which state-check
# reported as "declares 0 active workflow(s)". A lane holding a claimable row
# inside a workflow that is not `active` is a contradiction in the data, and
# the data is what every lane reads.
# ⚡ TASK-494 goes FIRST: the vendor adapter, then the screen. TASK-486 is
# SEQUENCED behind it — the journey cannot pass without an openable link.
design      = "Fortune Signora Authentication.dc.html"
screens     = ["07 Verify email"]
tasks       = ["TASK-494", "TASK-474", "TASK-486"]
owner       = "Lane A"
depends_on  = ["workflow.2"]
# ⚡ TASK-474 is the enabler and it is REAL infrastructure, not a simulation of
# a business rule: a developer must be able to open the verification link.
# ADR-0406 §6 puts ten of fourteen journey gaps behind it.

[workflow.4]
name        = "Forgot Password"
state       = "on_main"
design      = "Fortune Signora Authentication.dc.html"
screens     = ["08 Forgot password"]
tasks       = ["TASK-487"]
owner       = "Lane A"
depends_on  = ["workflow.3"]

[workflow.5]
name        = "Password Reset"
state       = "active"
# ⚡ 2026-08-08 — Workflows 1-4 reached `on_main` at QE cycle 121. This is the
# workflow implementation may build in now. TASK-488 is claimable.
# ⚠️ Workflow 4 is FORGOT PASSWORD (asking for the link). Workflow 5 is
# PASSWORD RESET (setting the new one). They are two screens and two rows,
# and conflating them overstates what has shipped by one journey.
design      = "Fortune Signora Authentication.dc.html"
screens     = ["09 Set a new password", "10 Success"]
tasks       = ["TASK-488"]
owner       = "Lane A"
depends_on  = ["workflow.4"]

[workflow.6]
name        = "Workspace Creation"
state       = "in_progress"
design      = "Fortune Signora Workspace Setup.dc.html"
tasks       = ["TASK-468"]
owner       = "Lane A"
# ⚠️ `in_progress` alongside workflow 3 being `active`, and that is a real
# exception rather than a slip: Lane A claimed TASK-468 before D-155 published
# the priority. D-123 makes CLAIMED the lane's state and this office does not
# unclaim. It lands or it is set aside by Lane A, never by here.
# ⚠️ Corrected 2026-08-08 — this note said "while workflow 1 is `active`", and
# workflow 1 reached `on_main`. A comment naming a state its subject has left
# is the class §2 forbids: the repository asserting something untrue of it.

