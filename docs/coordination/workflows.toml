# The customer-journey pipeline — D-160.
#
# **One workflow is implemented at a time; many are planned ahead of it.** This
# file is where that distinction is stored, because [D-160](../DECISION_REGISTER.md)
# asks for *"an explicit state"* per workflow and a state kept in prose is a
# state the generator cannot read — a lesson this office has now paid for three
# times (D-155, D-157, D-158, each corrected by moving a ruling into the data).
#
# ⛔ **This is not a specification.** [D-137](../DECISION_REGISTER.md) forbids a
# copied specification, an exported checklist or an intermediate implementation
# guide, and [D-138](../DECISION_REGISTER.md) makes
# [`design-snapshot/`](../design-snapshot/MANIFEST.md) the implementation
# authority. **Every workflow below names the design document it derives from
# and stores no design content of its own.** The decomposition lives in
# `BACKLOG.md` rows, which is the artifact §20e permits Product Office to write.
#
# ⚡ **The pipeline is planned many workflows deep and active exactly one deep.**
# **`active` is the only state an implementation lane may build in**, and it
# advances only when the product owner has reviewed the previous workflow on
# `main` ([D-153](../DECISION_REGISTER.md) ⑥).
#
# ── The twelve states, as D-160 names them ──────────────────────────────────
#   planned      the journey is identified and its design document is named
#   decomposed   epic, tasks, slices, dependencies and reuse are written
#   sequenced    placed in the queue behind its predecessor's review gate
#   ready        claimable — dependencies resolved, owner assigned
#   active       being implemented. ⛔ NORMALLY EXACTLY ONE
#   in_progress  a lane holds a row inside it
#   in_validation the lane has pushed and set the state
#   awaiting_qe  with QE for certification
#   on_main      promoted — ⚡ THIS is what releases the next workflow (D-169)
#   awaiting_review  the product owner has been notified
#   approved     reviewed and approved — ⚠️ a CHECKPOINT since D-169, not a gate
#   complete     approved and closed out
#
# ⛔ **Generated views read this file; nothing restates a workflow's state.**

# ── ⚡ WATCHED ARCHITECTURAL TRIGGERS — 496, 2026-08-08 ─────────────────────
# **Conditions that change a ratified decision, watched here rather than left
# in a document.** ⛔ 496 §5 attack ③ is why: this office identified the design
# tokens, published the finding, and never scheduled the work — and a lane paid
# for it. A trigger in a document is a trigger nobody checks.
#
# [trigger.object_level_sharing]
#   watch   = "any finalized design showing one person sharing one record with
#              another named person"
#   then    = "adopt OpenFGA behind the existing enforcer port (496 §2.2)"
#   why     = "RLS and a role matrix both stop being sufficient on the same day"
#   status  = "NOT MET — checked across all 26 designs 2026-08-08"
#
# [trigger.formal_verification]
#   watch   = "formal verification becomes an enterprise buying requirement,
#              or the capability matrix passes ~500 rules (today: 53)"
#   then    = "replace Casbin with Cedar behind the same port"
#   status  = "NOT MET"
#
# [trigger.better_auth_authz]
#   watch   = "Better Auth ships workspace-scoped ABAC with non-human subjects"
#   then    = "reopen D-175 — this is the evidence that would change it"
#   status  = "NOT MET — 1.5 trajectory is identity, not domain authorization"
# ───────────────────────────────────────────────────────────────────────────

[meta]
authority   = "docs/design-snapshot/screens/"
ruling      = "D-160"
updated     = 2026-08-07
active_rule = "exactly one workflow may be `active`; reaching `on_main` releases the next — D-169"
release_rule = "⚡ AMENDED 2026-08-08. ONE trigger, not two: the lane's own `IN VALIDATION` releases the next row, within a workflow AND between workflows. D-169 set the between-workflow trigger to `on_main`, and applied literally that made a lane idle a full QE cycle every time it finished a workflow — the exact waiting D-169 exists to remove, reappearing at the boundary. Safe because D-161 ④ and D-162 ④ require conformance findings to be fixed in the foundation, so they propagate to anything built meanwhile. The audit still runs on `main` before any review request; it no longer gates the next workflow. `approved` is a CHECKPOINT recorded after the fact, never a prerequisite. The pixel-level conformance audit remains mandatory before any review is requested, and is now the only gate."

