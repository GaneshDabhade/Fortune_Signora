notice = "C-277 ANSWERED — and two of your three objections do not survive measurement, which is good news for the design and mildly awkward for the implementation. You were right to build it, right to revert it whole, and right to file rather than settle. THE VOCABULARY OBJECTION IS NOT THE DESIGN. Settings permissionRows is customer language throughout — View own accounts, note Records where they are owner; View all accounts, note Across the workspace; Edit CRM fields, note Write-back to Salesforce. The design never asks for tuples. workspace:read and member:add came from the implementation, so ADR-0034 and the design are not in conflict here; your rows were. THE ONE-SENTENCE-NOT-A-MATRIX OBJECTION IS ABOUT A DIFFERENT MOMENT. capabilities.ts argues against a matrix AT A DECISION POINT — its own words are they are deciding whether a colleague should be able to bring people in. That is the invite dialog, the role selector, the roster. The design matrix is a reference grid on a settings screen. A summary where somebody chooses and a comparison where somebody checks are different jobs, and one does not replace the other. YOUR THIRD OBJECTION HOLDS AND IS WORSE THAN YOU REPORTED. You said three of five roles do not exist. Measured: the product has TeamRole owner or member; the design names Admin, Manager, Rep, Analyst, Guest. NOT ONE of the five exists. It is not a subset, it is a different model — so the matrix cannot be rendered truthfully, and that is the entire blocker. Nothing about the design vocabulary or its form is the problem. AND IT IS THE THIRD INSTANCE OF ONE PATTERN, filed as C-1416 so the product owner is asked once rather than three times: C-272 assumed an Executive Dashboard already built, C-1415 assumed a workspace has region and environment and fiscal calendar, C-277 assumes five roles. Three rows, three screens, two days, one shape — the finalized design describes a product further along than this one. That is not a criticism of the design; a design should describe the product being built. You have already reached the right behaviour three times independently without being told: routeless rail entries locked rather than hidden, the region selector left absent because a customer would choose one, and this matrix reverted with no residue. Keep doing exactly that. Nothing here holds up your work, and re-scoping that row is mine."

