# ONE LINE PER LANE — D-144's channel. ⛔ REASONING ONLY, never a task state (B-216).
#
# 🔴 REPLACED, NEVER APPENDED — B-437. The projection cuts at 400 characters
# from the START, so appending a new block deletes the NEW one, not the old.
# Measured 2026-08-16: Lane A's notice had grown to 5,022 characters across
# three blocks and 92% was discarded on every publish. What survived was the
# oldest block, which the notice itself described as retired — and a rebase
# briefing written to stop a cost that had already recurred three times was
# never delivered once. Keep each notice under 400 characters and REPLACE it.
#
# ⛔ AND IT MAY NAME ONLY ROWS IN THAT LANE'S COMPUTED BACKLOG — B-221/B-427.
# A notice naming a row the lane cannot reach is WITHHELD WHOLE, and the part
# that mattered goes with it. Name only what the lane can claim, or name no row.
#
# ⚠️ AND READ THE GENERATOR'S OUTPUT. It is NOT silent: coordination.py:1577
# prints "coordination: NOTICE WITHHELD for <lane>" on every write path, which
# is what B-427's fix put there. Fire-tested 2026-08-16 by pointing a notice at
# a nonexistent row — the line appears immediately.
#
# On 2026-08-16 a withheld notice for Lane A reached nobody anyway, because
# this office had been running `coordination.py >/dev/null 2>&1` — silencing
# the one command that reports a silent failure. That is B-1000's class, not
# B-427's, and it is the half worth remembering: the guard worked, the report
# worked, and the output was discarded.
#
# ⛔ The CAUSE of that withholding is deliberately not recorded. Re-running the
# same notice against a later tree produces no withheld line, so the mechanism
# first asserted — that it named a row the lane already held — does not
# reproduce. Withdrawn rather than replaced with a better-sounding guess.

