# Lane B — assigned execution queue.
#
# **Written by Lane C. No implementation lane writes this file, including its own.**
#
# **Ids are real `TASK-nnn`, never synthetic.** These carried `TASK-903-stage2`,
# `TASK-400-A7` and `TASK-902-C215` for a few hours — convenient for naming a
# narrowed scope and wrong: §20e says a row references a `TASK-nnn` because
# **an id is immutable and a title drifts**, and a queue id the backlog does not
# have matches nothing. The dashboard's orphan check found it by reporting
# TASK-903 as `READY` and in no queue while it sat at the top of one.
# **The narrowing lives in `[rationale]`, which is where a scope belongs.**
# **Ids only, never state** — execution state lives in BACKLOG.md and the board.
#
# **Read this file when you poll.** It answers "what do I build next" without
# deriving anything. Ownership is joined from modules.toml; you do not have to
# join it yourself, and you should not have to look for a row that names you.
#
# **Continuously populated** (D-070, product owner 2026-08-05): every eligible
# task is listed, not a batch of five. `blocked` names the rest and why.
#
# **The moment `current` leaves this lane, take `next`.** Do not wait for Lane C.
#
# ⚠️ **Corrected 2026-08-05 after Lane B reported an empty queue at C-329.**
# The previous version listed TASK-003 as `next`. C-018 is OPEN, is the product
# owner's, and its own `Blocks` field says TASK-003 cannot be implemented
# without the answer. **Lane C had judged the labelling half separable and put
# that judgement above the register's own statement.** Removed. TASK-408 was
# `current` throughout and remains claimable — it is not mentioned in C-329,
# which is the second half of the same defect: a queue nobody reads is a queue
# that was not published, however correct its contents.

# ══════════════════════════════════════════════════════════════════════════════
# ⚠️  NOTICE — 2026-08-05 · rebase before you run a suite
#
# The workstation lease (B-118, 436 change ①) is on `integration` at 551e1a7.
# **A workstation lease only excludes clones that hold it.** A clone that has
# not rebased still writes its lease into its own directory, where no other
# clone can see it — so two leases cover one PostgreSQL server and exclude
# nobody.
#
# Cycle 57 aborted on exactly this: `ALTER ROLE signora_app NOBYPASSRLS` —
# `tuple concurrently updated` — because a PostgreSQL role is **cluster-wide**
# and two suites reached it together. QE's tree had the fix; Lane A's did not.
#
# **So: `git fetch && git rebase origin/integration` before `make test`,
# `make certify`, or any pytest run.** Until every clone carries the fix,
# contention persists and looks exactly like the fix not working.
#
# Removed once all lanes are level. **This is sequencing, not code** — a clone
# that has not rebased looks only inside itself, and nothing the new lease
# writes can be seen by it.
# ══════════════════════════════════════════════════════════════════════════════

