note    = "ADR-0404 capability 3. Rescoped 2026-08-05 before a line was written: the ADR said the registry is built at the worker composition root `exactly as the API's registry already is`, and no composition root builds a ProviderRegistry anywhere. That sentence compared it to ai_platform's AI provider registry -- a different thing with a similar name, and the collision is live at apps/worker/subscriptions.py:153. SimulatedProviderAdapter is constructed only in tests and provider_platform has no Settings object. §10 puts a typed Settings with the module that owns the behaviour, which is Lane A's. Only the WorkerRuntime field is apps/. A field pointing at a registry nothing populates is the decorative class §2 forbids, so the halves are sequenced."
