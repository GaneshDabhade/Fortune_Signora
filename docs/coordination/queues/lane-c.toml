# **This lane writes its own queue, and that is the one asymmetry in the model.**
# It is recorded here rather than left implicit, because an office that assigns
# work to itself has removed its own check. Two things bound it:
#
#   **① Everything here is `infra/`, repository tooling, or architecture
#   preparation** — the three things D-022 and §20a place with this lane. **No
#   row in this file may name a product module**, and none does.
#
#   **② TASK-900 is flagged in its own backlog row as a self-assignment**, in
